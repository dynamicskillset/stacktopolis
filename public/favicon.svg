<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0a0e14"/>
  <!-- Isometric buildings on a dark background -->
  <!-- Small EU brick building -->
  <polygon points="8,20 14,17 14,12 8,15" fill="#c17f4a"/>
  <polygon points="14,17 20,20 20,15 14,12" fill="#8b5e3c"/>
  <polygon points="8,15 14,12 20,15 14,18" fill="#e0a870"/>
  <!-- Tall US glass building -->
  <polygon points="14,22 20,19 20,8 14,11" fill="#4a90d9"/>
  <polygon points="20,19 26,22 26,11 20,8" fill="#2c5f8a"/>
  <polygon points="14,11 20,8 26,11 20,14" fill="#8ab4e8"/>
  <!-- Small self-hosted shed -->
  <polygon points="4,26 8,24 8,20 4,22" fill="#5a7a5a"/>
  <polygon points="8,24 12,26 12,22 8,20" fill="#3d5a3d"/>
  <polygon points="4,22 8,20 12,22 8,24" fill="#7a9a7a"/>
  <!-- Ground diamond -->
  <polygon points="16,30 28,24 16,18 4,24" fill="#111820" stroke="#1e2a38" stroke-width="0.5"/>
</svg>
